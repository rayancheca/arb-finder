name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs of the same branch/PR — we only care about the latest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine — tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run engine tests
        run: pnpm --filter @arb/engine test 2>&1 | tee engine-test-output.txt

      - name: Enforce expected test count (52)
        run: |
          if ! grep -Eq "Tests[[:space:]]+52 passed \(52\)" engine-test-output.txt; then
            echo "::error::Engine test count is not 52/52. Inspect the test output above."
            exit 1
          fi
          echo "Engine test count confirmed: 52/52."

  web:
    name: web — typecheck + build
    runs-on: ubuntu-latest
    env:
      # Prisma client init needs DATABASE_URL at build time even though Next.js
      # only opens the SQLite file at request time. Using a tmp file keeps CI hermetic.
      DATABASE_URL: "file:/tmp/ci.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter web exec prisma generate --schema=../../db/schema.prisma

      - name: Create SQLite database
        run: pnpm --filter web exec prisma db push --schema=../../db/schema.prisma

      - name: Typecheck
        run: pnpm --filter web exec tsc --noEmit

      - name: Build
        run: pnpm --filter web build

  worker:
    name: worker — tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/worker/pyproject.toml

      - name: Install worker (with dev extras)
        run: pip install -e ".[dev]"

      - name: Pytest
        run: pytest tests/

      - name: Ruff
        run: ruff check arb_worker/
